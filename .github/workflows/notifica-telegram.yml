name: Notifica Telegram nuovo articolo

on:
  push:
    branches: [master]
    paths:
      - "content/blog/*.md"
  workflow_dispatch:
    inputs:
      slug:
        description: "Nome file dell'articolo senza .md (es. macchina-che-parla)"
        required: true

jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trova gli articoli nuovi
        env:
          SLUG: ${{ github.event.inputs.slug }}
          BEFORE: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "content/blog/${SLUG}.md" > nuovi.txt
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'content/blog/*.md' > nuovi.txt
          fi
          echo "Articoli da notificare:"
          cat nuovi.txt

      - name: Invia su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'PY'
          import os, re, time, urllib.parse, urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          base = "https://primadelverbo.it/blog/"
          ua = {"User-Agent": "Mozilla/5.0 (notifica-telegram)"}

          def campo(fm, nome):
              m = re.search(r'^' + nome + r':\s*"(.*)"\s*$', fm, re.M)
              return m.group(1).replace('\\"', '"') if m else ""

          for riga in open("nuovi.txt"):
              f = riga.strip()
              if not f:
                  continue
              testo = open(f, encoding="utf-8").read()
              parti = testo.split("---")
              fm = parti[1] if testo.startswith("---") and len(parti) > 2 else ""
              titolo = campo(fm, "title")
              estratto = campo(fm, "excerpt")
              url = base + os.path.basename(f)[:-3]

              # Netlify impiega 1-2 minuti a pubblicare: aspetto che la pagina sia online (max 6 min)
              for _ in range(12):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=20)
                      if r.status == 200:
                          break
                  except Exception:
                      pass
                  time.sleep(30)

              msg = "Nuovo articolo su Prima del Verbo\n\n" + titolo + "\n\n" + estratto + "\n\n" + url
              dati = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
              urllib.request.urlopen("https://api.telegram.org/bot" + token + "/sendMessage", data=dati, timeout=30)
              print("Inviato:", url)
          PY
